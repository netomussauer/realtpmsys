# Pipeline de build + push da imagem realtpmsys API (Go).
#
# Stages:
#   git-clone (shallow do Gitea mirror)
#   → kaniko-build-push (Dockerfile da raiz → harbor.lab.local/realtpmsys/api)
#   → rollout-restart (kubectl restart Deployment p/ puxar :latest novo)
#
# Tasks usadas:
#   - amfit-git-clone           → reutilizada do ns cicd (debian-based)
#   - realtpmsys-kaniko-build-push → local (corrige bug do secret hardcoded
#                                    na task kaniko-build-push genérica)
#   - rollout-restart           → inline; usa SA tekton-realtpmsys com Role
#                                 tekton-rollout no ns realtpmsys (RBAC
#                                 cross-namespace em infra/k8s/tekton-rollout-rbac.yaml).
#
# Falha fast: qualquer task com erro aborta o pipeline.
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: realtpmsys-build-api
  namespace: cicd
  labels:
    app.kubernetes.io/component: "pipeline-api"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  description: |
    Pipeline de build + push da imagem realtpmsys API (Go).
    Stages: git-clone -> kaniko build/push (Dockerfile na raiz).
    Reutiliza Tasks compartilhadas no ns cicd.
  params:
    - name: git-url
      type: string
      description: URL do repositório Gitea (mirror).
      default: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/realtpmsys.git"
    - name: git-revision
      type: string
      description: Branch/tag/SHA a buildar.
      default: "main"
    - name: image-repo
      type: string
      description: Repositório Harbor de destino.
      default: "harbor.lab.local/realtpmsys/api"
    - name: image-tag
      type: string
      description: Tag da imagem (além de :latest que sempre é pushada).
      default: "latest"
  results:
    - name: image-digest
      description: Digest sha256 da imagem publicada.
      value: "$(tasks.kaniko-build-push.results.image-digest)"
    - name: commit
      description: SHA do commit buildado.
      value: "$(tasks.git-clone.results.commit)"
  tasks:
    - name: git-clone
      taskRef:
        kind: Task
        name: amfit-git-clone     # reutiliza a task debian-based existente
      params:
        - name: url
          value: "$(params.git-url)"
        - name: revision
          value: "$(params.git-revision)"
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source
    - name: kaniko-build-push
      taskRef:
        kind: Task
        name: realtpmsys-kaniko-build-push   # task local — usa workspace docker-credentials
      runAfter: ["git-clone"]
      params:
        - name: image
          value: "$(params.image-repo)"
        - name: tag
          value: "$(params.image-tag)"
        - name: dockerfile
          value: "Dockerfile"
        - name: context
          value: "."
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials
    # ---------------------------------------------------------------------
    # rollout-restart: força o Deployment a puxar a :latest recém-pushada.
    # Inline porque é específico desta pipeline (1 deployment alvo) e curto.
    # Requer Role tekton-rollout no ns realtpmsys (vide
    # infra/k8s/tekton-rollout-rbac.yaml).
    # Imagem `bitnami/kubectl:latest` — segue o padrão das outras tasks do
    # ns cicd (`alpine/git`, `bitnami/git:latest`). Tag específica `1.29.3`
    # foi tentada antes mas não existe no Docker Hub.
    # Timeout do `rollout status` é mais curto que o do PipelineRun para
    # falhar fast em caso de pod em erro.
    # ---------------------------------------------------------------------
    - name: rollout-restart
      runAfter: ["kaniko-build-push"]
      taskSpec:
        description: |
          Reinicia o Deployment realtpmsys-api no ns realtpmsys e aguarda
          até 3min o rollout completar. Bypassa GitOps de imagem porque o
          Deployment usa tag :latest (sem mudança no manifesto).
        steps:
          - name: restart
            image: docker.io/bitnami/kubectl:latest
            script: |
              #!/bin/sh
              set -eu
              echo "→ kubectl rollout restart deployment/realtpmsys-api -n realtpmsys"
              kubectl rollout restart deployment/realtpmsys-api -n realtpmsys
              echo "→ kubectl rollout status (timeout 3m)"
              kubectl rollout status deployment/realtpmsys-api -n realtpmsys --timeout=3m
  workspaces:
    - name: source
      description: Workspace onde o código é clonado e compartilhado entre tasks.
    - name: docker-credentials
      description: Workspace que monta o Secret harbor-push-realtpmsys (config.json) para Kaniko.
