# Pipeline Tekton do apps/web — Next.js standalone via Kaniko.
#
# Stages:
#   git-clone (shallow do mirror Gitea)
#   → kaniko-build-push (apps/web/Dockerfile → harbor.lab.local/realtpmsys/web)
#   → rollout-restart (deploy realtpmsys-web no ns realtpmsys)
#
# Reutiliza:
#   - Task amfit-git-clone (debian-based, no ns cicd)
#   - Task realtpmsys-kaniko-build-push (no ns cicd, com secret Harbor)
#   - Role tekton-rollout no ns realtpmsys (criada na entrega do auto-rollout
#     do backend Go — get/list/watch/patch em deployments cobre o web também)
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: realtpmsys-build-web
  namespace: cicd
  labels:
    app.kubernetes.io/component: "pipeline-web"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton-web"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  description: |
    Pipeline de build + push da imagem realtpmsys WEB (Next.js).
    Stages: git-clone -> kaniko build/push (apps/web/Dockerfile) -> rollout-restart.

    IMPORTANTE — `podTemplate.dnsConfig` é obrigatório no PipelineRun:
    o CoreDNS deste lab retorna AAAA-only intermitente para
    `registry.npmjs.org`, causando EAI_AGAIN no `npm install`. Use o
    template em `example-pipelinerun.yaml.example` ao disparar manual.
  params:
    - name: git-url
      type: string
      default: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/realtpmsys.git"
    - name: git-revision
      type: string
      default: "main"
    - name: image-repo
      type: string
      default: "harbor.lab.local/realtpmsys/web"
    - name: image-tag
      type: string
      description: "Tag adicional além de :latest (use sha-<7chars>)."
      default: "latest"
  results:
    - name: image-digest
      description: Digest sha256 da imagem publicada.
      value: "$(tasks.kaniko-build-push.results.image-digest)"
    - name: commit
      description: SHA do commit buildado.
      value: "$(tasks.git-clone.results.commit)"
  tasks:
    - name: git-clone
      taskRef:
        kind: Task
        name: amfit-git-clone
      params:
        - name: url
          value: "$(params.git-url)"
        - name: revision
          value: "$(params.git-revision)"
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source

    - name: kaniko-build-push
      taskRef:
        kind: Task
        name: realtpmsys-kaniko-build-push
      runAfter: ["git-clone"]
      params:
        - name: image
          value: "$(params.image-repo)"
        - name: tag
          value: "$(params.image-tag)"
        # IMPORTANTE: o param `dockerfile` é RELATIVO ao `context` (a task
        # passa `--dockerfile=<valor>` + `--context=dir://workspace/<context>`).
        # Logo: context=apps/web aponta ao subdir e dockerfile=Dockerfile
        # resolve para apps/web/Dockerfile no workspace.
        - name: dockerfile
          value: "Dockerfile"
        - name: context
          value: "apps/web"
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials

    # ---------------------------------------------------------------------
    # rollout-restart: força o Deployment realtpmsys-web a puxar :latest.
    # Mesmo padrão do api (ADR-010 do backend): tag :latest sem GitOps de
    # imagem, restart explícito após push pro Harbor.
    # ---------------------------------------------------------------------
    - name: rollout-restart
      runAfter: ["kaniko-build-push"]
      taskSpec:
        steps:
          - name: restart
            image: docker.io/bitnami/kubectl:latest
            script: |
              #!/bin/sh
              set -eu
              echo "→ kubectl rollout restart deployment/realtpmsys-web -n realtpmsys"
              kubectl rollout restart deployment/realtpmsys-web -n realtpmsys
              echo "→ kubectl rollout status (timeout 3m)"
              kubectl rollout status deployment/realtpmsys-web -n realtpmsys --timeout=3m
  workspaces:
    - name: source
      description: Workspace onde o código é clonado e compartilhado entre tasks.
    - name: docker-credentials
      description: Secret harbor-push-realtpmsys (config.json) para Kaniko autenticar no Harbor.
