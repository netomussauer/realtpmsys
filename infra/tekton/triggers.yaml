# Triggers Tekton para o webhook push do Gitea no repo labadmin/realtpmsys.
#
# Fluxo:
#   Gitea push → EventListener (realtpmsys-event-listener)
#                ↓ github interceptor (valida HMAC via X-Hub-Signature-256)
#                ↓ cel interceptor (filtra refs/heads/main + extrai short_sha)
#                ↓ realtpmsys-gitea-binding (mapeia body → params)
#                ↓ realtpmsys-build-template (cria PipelineRun)
#   PipelineRun realtpmsys-build-api-<sha7>-<rand>
#
# Sobre o interceptor "github": não existe ClusterInterceptor "gitea" neste
# cluster (só cel, github, gitlab, bitbucket, slack). Gitea >= 1.16 envia,
# além do X-Gitea-Signature nativo, um X-Hub-Signature-256 no mesmo formato
# do GitHub (HMAC-SHA256, prefixo "sha256=") especificamente para
# compatibilidade — confirmado no código-fonte do Gitea 1.25.5
# (services/webhook/deliver.go: req.Header.Add("X-Hub-Signature-256",
# "sha256="+signatureSHA256), calculado com o mesmo secret do webhook).
# Isso permite reaproveitar o interceptor "github" já instalado, sem precisar
# de um interceptor customizado. Requer configurar o mesmo secret na Secret
# K8s abaixo e no campo "Secret" do webhook no Gitea.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: realtpmsys-gitea-binding
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger-binding"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-revision-short
      value: $(extensions.short_sha)
    - name: git-ref
      value: $(body.ref)
    - name: pusher
      value: $(body.pusher.username)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: realtpmsys-build-template
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger-template"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: git-revision-short
    - name: git-ref
    - name: pusher
      default: "unknown"
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: realtpmsys-build-api-$(tt.params.git-revision-short)-
        namespace: cicd
        annotations:
          gitea.io/pusher: "$(tt.params.pusher)"
          gitea.io/ref: "$(tt.params.git-ref)"
        labels:
          app.kubernetes.io/component: "pipelinerun-api"
          app.kubernetes.io/managed-by: "argocd"
          app.kubernetes.io/name: "realtpmsys-tekton"
          environment: "dev"
          git-revision-short: "$(tt.params.git-revision-short)"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
          tekton.dev/pipeline: "realtpmsys-build-api"
          trigger: "gitea-push"
      spec:
        pipelineRef:
          name: realtpmsys-build-api
        timeouts:
          pipeline: "30m"
          tasks: "20m"
        taskRunTemplate:
          # serviceAccountName precisa estar aqui (não no nível de spec) —
          # o campo PipelineRun.spec.serviceAccountName é ignorado pelo
          # Tekton Pipelines v1 (substituído por taskRunTemplate.serviceAccountName).
          # Bug real encontrado em 2026-09-01: o primeiro PipelineRun genuinamente
          # disparado por webhook neste cluster rodou como
          # system:serviceaccount:cicd:default (sem a Role tekton-rollout
          # cross-namespace), então a task rollout-restart falhou com 403 ao
          # tentar `kubectl rollout restart deployment/realtpmsys-api -n realtpmsys`
          # mesmo com o build+push tendo funcionado normalmente.
          serviceAccountName: tekton-realtpmsys
          podTemplate:
            nodeSelector:
              workload: cicd
            securityContext:
              fsGroup: 65532
        params:
          - name: git-url
            # Webhook envia clone_url externo (http://gitea.lab.local/...).
            # Substitui pelo Service DNS interno para não depender de Pi-hole.
            value: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/realtpmsys.git"
          - name: git-revision
            value: "$(tt.params.git-revision)"
          - name: image-repo
            value: "harbor.lab.local/realtpmsys/api"
          - name: image-tag
            # Usa o short SHA do commit como tag para permitir rollback.
            # A task kaniko-build-push também publica :latest automaticamente.
            value: "sha-$(tt.params.git-revision-short)"
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: "5Gi"
                storageClassName: local-path
          - name: docker-credentials
            secret:
              secretName: harbor-push-realtpmsys
              # Renomeia .dockerconfigjson → config.json para Kaniko
              # ler via DOCKER_CONFIG=/kaniko/.docker.
              items:
                - key: .dockerconfigjson
                  path: config.json
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: realtpmsys-gitea-push
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceAccountName: tekton-realtpmsys
  bindings:
    - ref: realtpmsys-gitea-binding
      kind: TriggerBinding
  interceptors:
    - ref:
        kind: ClusterInterceptor
        name: github
      params:
        - name: secretRef
          value:
            secretName: gitea-webhook-secret-realtpmsys
            secretKey: secretToken
    - ref:
        kind: ClusterInterceptor
        name: cel
      params:
        - name: filter
          value: "body.ref == 'refs/heads/main' && body.head_commit.id != ''"
        - name: overlays
          value:
            - key: short_sha
              expression: "body.head_commit.id.truncate(7)"
  template:
    ref: realtpmsys-build-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: realtpmsys-event-listener
  namespace: cicd
  labels:
    app.kubernetes.io/component: "event-listener"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceAccountName: tekton-realtpmsys
  triggers:
    - triggerRef: realtpmsys-gitea-push
  resources:
    kubernetesResource:
      serviceType: ClusterIP
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: "event-listener"
              app.kubernetes.io/name: "realtpmsys-tekton"
              environment: "dev"
              lab_id: "lab-k8s-01"
              lab_owner: "jose.mussauer"
          spec:
            nodeSelector:
              workload: cicd
            containers:
              - name: ""
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "256Mi"
