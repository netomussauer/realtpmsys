# Deployment do apps/web — Next.js 15 standalone em distroless.
#
# Compartilha o ns realtpmsys com o backend Go — mesmo SealedSecret
# realtpmsys-secrets fornece o JWT_SECRET (chave jwt-secret) que precisa
# bater entre os dois (BFF faz jwtVerify dos tokens emitidos pelo Go).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtpmsys-web
  namespace: realtpmsys
  labels:
    app.kubernetes.io/name: "realtpmsys-web"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: "realtpmsys-web"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "realtpmsys-web"
        app.kubernetes.io/component: "frontend"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        # Mesmo padrão do backend Go — ambos roam no worker cicd.
        workload: cicd
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: web
          image: harbor.lab.local/realtpmsys/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # URL pública embarcada no bundle em build-time não precisa repetir
            # aqui — está no Dockerfile via ARG. Em runtime, INTERNAL_API_URL
            # aponta pro Service ClusterIP do backend Go (latência mínima).
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://realtpmsys-api.realtpmsys.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.realtpmsys.local:8000"
            # JWT_SECRET deve bater com o backend (mesmo Secret).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: realtpmsys-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # Distroless não tem shell — usa httpGet em vez de exec.
          # /api/auth/session retorna 401 sem cookie mas responde — perfeito
          # pra liveness/readiness (testa app + middleware funcionando).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
