apiVersion: v1
kind: Service
metadata:
  name: realtpmsys-api
  namespace: realtpmsys
  labels:
    app.kubernetes.io/name: "realtpmsys-api"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  # Exposição via MetalLB (lab não tem IngressController dedicado). DNS:
  # api.realtpmsys.local -> 192.168.1.208
  # IP escolhido na sequência: amfit ocupa 205-207, próximo livre = 208.
  type: LoadBalancer
  loadBalancerIP: 192.168.1.208
  selector:
    app.kubernetes.io/name: "realtpmsys-api"
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
