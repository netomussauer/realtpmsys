# ArgoCD Application secundária — gerencia os manifestos Tekton do realtpmsys.
#
# Separada da Application principal porque:
#   - Recursos vivem em ns cicd (não realtpmsys)
#   - SealedSecret webhook + ServiceAccount precisam de RBAC distinto
#
# Aplicar uma única vez:
#   kubectl apply -f infra/argocd/application-tekton.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realtpmsys-tekton
  namespace: cicd
  labels:
    app.kubernetes.io/name: "realtpmsys-tekton"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/part-of: "realtpmsys"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/realtpmsys.git"
    targetRevision: main
    path: "infra/tekton"
    directory:
      recurse: true
      exclude: "*.example"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cicd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "5s"
        factor: 2
        maxDuration: "3m"
